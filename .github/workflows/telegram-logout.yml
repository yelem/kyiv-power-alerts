name: telegram-logout

on:
  workflow_dispatch:

permissions: {}

jobs:
  logout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install telethon==1.43.2
      - name: Terminate the relay's Telegram session
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        shell: python
        run: |
          import os
          from telethon.sessions import StringSession
          from telethon.sync import TelegramClient
          c = TelegramClient(StringSession(os.environ["TG_SESSION"]), int(os.environ["TG_API_ID"]), os.environ["TG_API_HASH"])
          c.connect()
          if c.is_user_authorized():
              print("logged out:", c.log_out())
          else:
              print("session was already invalid")
          c.disconnect()
