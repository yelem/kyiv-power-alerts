name: health

# Fails (and GitHub emails the owner) only for problems the bot can't report in Telegram.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  actions: write # to keep the schedule enabled, see the last step

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Health check
        run: python3 monitor/health.py
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          HEALTH_SECRET: ${{ secrets.HEALTH_SECRET }}

      # GitHub disables scheduled workflows after 60 days without repository activity;
      # re-enabling via the API on every run keeps it alive without commits.
      - name: Keep schedule enabled
        if: always() && github.event_name == 'schedule'
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/health.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
